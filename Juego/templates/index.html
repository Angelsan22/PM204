{% extends "base.html" %}
{% block content %}
<h2>Mapa de Navegación</h2>
<ul>
    {% for key, section in sections.items() %}
        {% if key in unlocked %}
            <li><a href="{{ url_for('section', name=key) }}">{{ section.title }}</a> ✅</li>
        {% else %}
            <li>{{ section.title }} </li>
        {% endif %}
    {% endfor %}
</ul>
{% endblock %}
